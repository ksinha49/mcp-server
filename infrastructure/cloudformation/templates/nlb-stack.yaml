AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Application: MCP (Model Context Protocol)
  Purpose: Internal Network Load Balancer with PrivateLink for MCP Services
  Owner: AIO Platform Team
  Managed by: AIO Platform Team

Parameters:
  AWSAccountName:
    Type: String
    Default: "alic-aio-mcp"
    Description: "AWS Account Name for resource naming (format: company-group-app)"

  CompanyName:
    Type: String
    Default: "alic"
    Description: Company identifier
    AllowedValues:
      - alic

  AppName:
    Type: String
    Default: "mcp"
    Description: Application or project name (lowercase, no spaces)
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: p
    AllowedValues:
      - d    # Development
      - t    # Test
      - m    # Model (UAT/Staging)
      - p    # Production
    Description: Deployment environment

  DataClassification:
    Type: String
    Default: confidential
    AllowedValues:
      - public
      - confidential
      - secret
    Description: Data classification level

  OwnerEmail:
    Type: String
    Default: "aio-support@ameritas.com"
    Description: Owner email for tagging

  CostCenter:
    Type: String
    Default: "aio"
    Description: Cost center for billing

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for NLB

  LiteLLMAccountId:
    Type: String
    Default: ''
    Description: AWS Account ID for LiteLLM consumer (for PrivateLink)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming Configuration"
        Parameters:
          - CompanyName
          - AppName
          - Environment
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcId
          - PrivateSubnetIds
      - Label:
          default: "Cross-Account Configuration"
        Parameters:
          - LiteLLMAccountId
      - Label:
          default: "Compliance & Tagging"
        Parameters:
          - DataClassification
          - OwnerEmail
          - CostCenter

Conditions:
  HasLiteLLMAccount: !Not [!Equals [!Ref LiteLLMAccountId, '']]

Resources:
  # Internal Network Load Balancer
  # Pattern: {app}-{env}-nlb
  MCPInternalNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AppName}-${Environment}-nlb
      Type: network
      Scheme: internal
      Subnets: !Ref PrivateSubnetIds
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-nlb
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Combined Service (port 8000)
  # Pattern: {app}-{env}-{service}-tg
  CombinedTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-combined-tg
      Port: 8000
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-combined-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for OAuth Gateway (port 8000 alternate)
  OAuthGatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-oauth-tg
      Port: 8000
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-oauth-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Outlook (port 8001)
  OutlookTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-outlook-tg
      Port: 8001
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-outlook-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for SharePoint (port 8002)
  SharePointTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-sharepoint-tg
      Port: 8002
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-sharepoint-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Teams (port 8003)
  TeamsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-teams-tg
      Port: 8003
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-teams-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Azure DevOps (port 8004)
  AzureDevOpsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-azuredevops-tg
      Port: 8004
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-azuredevops-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Snowflake (port 8005)
  SnowflakeTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-snowflake-tg
      Port: 8005
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-snowflake-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Target Group for Context7 (port 8006)
  Context7TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-${Environment}-context7-tg
      Port: 8006
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-context7-tg
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # NLB Listeners
  CombinedListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8000
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref CombinedTargetGroup

  OutlookListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8001
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref OutlookTargetGroup

  SharePointListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8002
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SharePointTargetGroup

  TeamsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8003
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TeamsTargetGroup

  AzureDevOpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8004
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AzureDevOpsTargetGroup

  SnowflakeListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8005
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref SnowflakeTargetGroup

  Context7Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MCPInternalNLB
      Port: 8006
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Context7TargetGroup

  # VPC Endpoint Service (PrivateLink Provider)
  MCPEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      AcceptanceRequired: true
      NetworkLoadBalancerArns:
        - !Ref MCPInternalNLB
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-endpoint-service
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Allow LiteLLM Account to connect (if specified)
  EndpointServicePermission:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Condition: HasLiteLLMAccount
    Properties:
      ServiceId: !Ref MCPEndpointService
      AllowedPrincipals:
        - !Sub arn:aws:iam::${LiteLLMAccountId}:root

Outputs:
  NLBArn:
    Description: NLB ARN
    Value: !Ref MCPInternalNLB
    Export:
      Name: !Sub ${AWS::StackName}-NLBArn

  NLBDNSName:
    Description: NLB DNS Name
    Value: !GetAtt MCPInternalNLB.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-NLBDNSName

  EndpointServiceId:
    Description: VPC Endpoint Service ID
    Value: !Ref MCPEndpointService
    Export:
      Name: !Sub ${AWS::StackName}-EndpointServiceId

  EndpointServiceName:
    Description: VPC Endpoint Service Name
    Value: !Sub com.amazonaws.vpce.${AWS::Region}.${MCPEndpointService}
    Export:
      Name: !Sub ${AWS::StackName}-EndpointServiceName

  CombinedTargetGroupArn:
    Description: Combined Service Target Group ARN
    Value: !Ref CombinedTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-CombinedTargetGroupArn

  OAuthGatewayTargetGroupArn:
    Description: OAuth Gateway Target Group ARN
    Value: !Ref OAuthGatewayTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-OAuthGatewayTargetGroupArn

  OutlookTargetGroupArn:
    Description: Outlook Target Group ARN
    Value: !Ref OutlookTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-OutlookTargetGroupArn

  SharePointTargetGroupArn:
    Description: SharePoint Target Group ARN
    Value: !Ref SharePointTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-SharePointTargetGroupArn

  TeamsTargetGroupArn:
    Description: Teams Target Group ARN
    Value: !Ref TeamsTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-TeamsTargetGroupArn

  AzureDevOpsTargetGroupArn:
    Description: Azure DevOps Target Group ARN
    Value: !Ref AzureDevOpsTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-AzureDevOpsTargetGroupArn

  SnowflakeTargetGroupArn:
    Description: Snowflake Target Group ARN
    Value: !Ref SnowflakeTargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-SnowflakeTargetGroupArn

  Context7TargetGroupArn:
    Description: Context7 Target Group ARN
    Value: !Ref Context7TargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-Context7TargetGroupArn
