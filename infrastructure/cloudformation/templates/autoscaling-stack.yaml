AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Application: MCP (Model Context Protocol)
  Purpose: Auto-scaling policies for MCP Services
  Owner: AIO Platform Team
  Managed by: AIO Platform Team

Parameters:
  AWSAccountName:
    Type: String
    Default: "alic-aio-mcp"
    Description: "AWS Account Name for resource naming (format: company-group-app)"

  CompanyName:
    Type: String
    Default: "alic"
    Description: Company identifier
    AllowedValues:
      - alic

  AppName:
    Type: String
    Default: "mcp"
    Description: Application or project name (lowercase, no spaces)
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: p
    AllowedValues:
      - d    # Development
      - t    # Test
      - m    # Model (UAT/Staging)
      - p    # Production
    Description: Deployment environment

  DataClassification:
    Type: String
    Default: confidential
    AllowedValues:
      - public
      - confidential
      - secret
    Description: Data classification level

  OwnerEmail:
    Type: String
    Default: "aio-support@ameritas.com"
    Description: Owner email for tagging

  CostCenter:
    Type: String
    Default: "aio"
    Description: Cost center for billing

  ECSClusterName:
    Type: String
    Description: ECS Cluster name

  AutoScalingRoleArn:
    Type: String
    Description: Auto Scaling Role ARN

  # Min/Max capacity settings
  OAuthGatewayMinCapacity:
    Type: Number
    Default: 2
    Description: Minimum number of OAuth Gateway tasks

  OAuthGatewayMaxCapacity:
    Type: Number
    Default: 10
    Description: Maximum number of OAuth Gateway tasks

  CombinedServiceMinCapacity:
    Type: Number
    Default: 2
    Description: Minimum number of Combined Service tasks

  CombinedServiceMaxCapacity:
    Type: Number
    Default: 10
    Description: Maximum number of Combined Service tasks

  MCPServiceMinCapacity:
    Type: Number
    Default: 2
    Description: Minimum number of individual MCP service tasks

  MCPServiceMaxCapacity:
    Type: Number
    Default: 6
    Description: Maximum number of individual MCP service tasks

  # Scaling thresholds
  CPUTargetValue:
    Type: Number
    Default: 70
    Description: Target CPU utilization percentage

  MemoryTargetValue:
    Type: Number
    Default: 80
    Description: Target Memory utilization percentage

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming Configuration"
        Parameters:
          - CompanyName
          - AppName
          - Environment
      - Label:
          default: "ECS Configuration"
        Parameters:
          - ECSClusterName
          - AutoScalingRoleArn
      - Label:
          default: "Scaling Configuration"
        Parameters:
          - OAuthGatewayMinCapacity
          - OAuthGatewayMaxCapacity
          - CombinedServiceMinCapacity
          - CombinedServiceMaxCapacity
          - MCPServiceMinCapacity
          - MCPServiceMaxCapacity
          - CPUTargetValue
          - MemoryTargetValue
      - Label:
          default: "Compliance & Tagging"
        Parameters:
          - DataClassification
          - OwnerEmail
          - CostCenter

Resources:
  # ============================================
  # OAuth Gateway Auto-Scaling
  # ============================================
  OAuthGatewayScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref OAuthGatewayMaxCapacity
      MinCapacity: !Ref OAuthGatewayMinCapacity
      ResourceId: !Sub service/${ECSClusterName}/${AppName}-${Environment}-oauthgateway-ecsservice
      RoleARN: !Ref AutoScalingRoleArn
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  OAuthGatewayCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${AppName}-${Environment}-oauthgateway-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref OAuthGatewayScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CPUTargetValue
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  OAuthGatewayMemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub ${AppName}-${Environment}-oauthgateway-memory-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref OAuthGatewayScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref MemoryTargetValue
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ============================================
  # Combined Service Auto-Scaling
  # ============================================
  CombinedServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
