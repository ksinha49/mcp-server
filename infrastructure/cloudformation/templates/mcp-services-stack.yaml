            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-combined-taskdef
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  CombinedService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${AppName}-${Environment}-combined-ecsservice
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref CombinedServiceTaskDefinition
