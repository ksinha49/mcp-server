AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Application: MCP (Model Context Protocol)
  Purpose: ECS Services for all MCP Servers
  Owner: AIO Platform Team
  Managed by: AIO Platform Team

Parameters:
  AWSAccountName:
    Type: String
    Default: "alic-aio-mcp"
    Description: "AWS Account Name for resource naming (format: company-group-app)"

  CompanyName:
    Type: String
    Default: "alic"
    Description: Company identifier
    AllowedValues:
      - alic

  AppName:
    Type: String
    Default: "mcp"
    Description: Application or project name (lowercase, no spaces)
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: p
    AllowedValues:
      - d    # Development
      - t    # Test
      - m    # Model (UAT/Staging)
      - p    # Production
    Description: Deployment environment

  DataClassification:
    Type: String
    Default: confidential
    AllowedValues:
      - public
      - confidential
      - secret
    Description: Data classification level

  OwnerEmail:
    Type: String
    Default: "aio-support@ameritas.com"
    Description: Owner email for tagging

  CostCenter:
    Type: String
    Default: "aio"
    Description: Cost center for billing

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for ECS services

  ECSClusterArn:
    Type: String
    Description: ECS Cluster ARN

  ECSServicesSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for ECS services

  ECSTaskExecutionRoleArn:
    Type: String
    Description: ECS Task Execution Role ARN

  # Service-specific Task Role ARNs
  OAuthGatewayTaskRoleArn:
    Type: String
    Description: OAuth Gateway Task Role ARN

  CombinedServiceTaskRoleArn:
    Type: String
    Description: Combined Service Task Role ARN

  OutlookServiceTaskRoleArn:
    Type: String
    Description: Outlook Service Task Role ARN

  SharePointServiceTaskRoleArn:
    Type: String
    Description: SharePoint Service Task Role ARN

  TeamsServiceTaskRoleArn:
    Type: String
    Description: Teams Service Task Role ARN

  AzureDevOpsServiceTaskRoleArn:
    Type: String
    Description: Azure DevOps Service Task Role ARN

  SnowflakeServiceTaskRoleArn:
    Type: String
    Description: Snowflake Service Task Role ARN

  Context7ServiceTaskRoleArn:
    Type: String
    Description: Context7 Service Task Role ARN

  # Target Group ARNs
  CombinedTargetGroupArn:
    Type: String
    Description: Combined Service Target Group ARN

  OAuthGatewayTargetGroupArn:
    Type: String
    Description: OAuth Gateway Target Group ARN

  OutlookTargetGroupArn:
    Type: String
    Description: Outlook Target Group ARN

  SharePointTargetGroupArn:
    Type: String
    Description: SharePoint Target Group ARN

  TeamsTargetGroupArn:
    Type: String
    Description: Teams Target Group ARN

  AzureDevOpsTargetGroupArn:
    Type: String
    Description: Azure DevOps Target Group ARN

  SnowflakeTargetGroupArn:
    Type: String
    Description: Snowflake Target Group ARN

  Context7TargetGroupArn:
    Type: String
    Description: Context7 Target Group ARN

  # Service Discovery ARNs
  OAuthGatewayServiceDiscoveryArn:
    Type: String
    Description: OAuth Gateway Service Discovery ARN

  CombinedServiceDiscoveryArn:
    Type: String
    Description: Combined Service Discovery ARN

  OutlookServiceDiscoveryArn:
    Type: String
    Description: Outlook Service Discovery ARN

  SharePointServiceDiscoveryArn:
    Type: String
    Description: SharePoint Service Discovery ARN

  TeamsServiceDiscoveryArn:
    Type: String
    Description: Teams Service Discovery ARN

  AzureDevOpsServiceDiscoveryArn:
    Type: String
    Description: Azure DevOps Service Discovery ARN

  SnowflakeServiceDiscoveryArn:
    Type: String
    Description: Snowflake Service Discovery ARN

  Context7ServiceDiscoveryArn:
    Type: String
    Description: Context7 Service Discovery ARN

  # Container Image URIs
  ECRRepositoryUri:
    Type: String
    Description: ECR Repository base URI (e.g., 123456789012.dkr.ecr.us-east-2.amazonaws.com)

  ImageTag:
    Type: String
    Default: latest
    Description: Container image tag

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming Configuration"
        Parameters:
          - CompanyName
          - AppName
          - Environment
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcId
          - PrivateSubnetIds
          - ECSServicesSecurityGroupId
      - Label:
          default: "ECS Configuration"
        Parameters:
          - ECSClusterArn
          - ECSTaskExecutionRoleArn
          - ECRRepositoryUri
          - ImageTag
      - Label:
          default: "Task Roles"
        Parameters:
          - OAuthGatewayTaskRoleArn
          - CombinedServiceTaskRoleArn
          - OutlookServiceTaskRoleArn
          - SharePointServiceTaskRoleArn
          - TeamsServiceTaskRoleArn
          - AzureDevOpsServiceTaskRoleArn
          - SnowflakeServiceTaskRoleArn
          - Context7ServiceTaskRoleArn
      - Label:
          default: "Target Groups"
        Parameters:
          - OAuthGatewayTargetGroupArn
          - CombinedTargetGroupArn
          - OutlookTargetGroupArn
          - SharePointTargetGroupArn
          - TeamsTargetGroupArn
          - AzureDevOpsTargetGroupArn
          - SnowflakeTargetGroupArn
          - Context7TargetGroupArn
      - Label:
          default: "Service Discovery"
        Parameters:
          - OAuthGatewayServiceDiscoveryArn
          - CombinedServiceDiscoveryArn
          - OutlookServiceDiscoveryArn
          - SharePointServiceDiscoveryArn
          - TeamsServiceDiscoveryArn
          - AzureDevOpsServiceDiscoveryArn
          - SnowflakeServiceDiscoveryArn
          - Context7ServiceDiscoveryArn
      - Label:
          default: "Compliance & Tagging"
        Parameters:
          - DataClassification
          - OwnerEmail
          - CostCenter

Resources:
  # ============================================
  # OAuth Gateway Service
  # Pattern: {app}-{env}-{service}-taskdef / {app}-{env}-{service}-ecsservice
  # ============================================
  OAuthGatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-${Environment}-oauthgateway-taskdef
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !Ref OAuthGatewayTaskRoleArn
      ContainerDefinitions:
        - Name: oauth-gateway
          Image: !Sub ${ECRRepositoryUri}/mcp-oauth-gateway:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: LOG_LEVEL
              Value: INFO
            - Name: ENVIRONMENT
              Value: !Ref Environment
          Secrets:
            - Name: REDIS_URL
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/${Environment}/redis/url
            - Name: DATABASE_URL
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/${Environment}/database/url
            - Name: MICROSOFT_CLIENT_ID
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/${Environment}/microsoft/client_id
            - Name: MICROSOFT_CLIENT_SECRET
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/${Environment}/microsoft/client_secret
            - Name: MICROSOFT_TENANT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp/${Environment}/microsoft/tenant_id
            - Name: TOKEN_ENCRYPTION_KEY
              ValueFrom: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/${Environment}/encryption/token_key
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub /ecs/${AppName}-${Environment}-oauthgateway
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-oauthgateway-taskdef
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  OAuthGatewayService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub ${AppName}-${Environment}-oauthgateway-ecsservice
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref OAuthGatewayTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ECSServicesSecurityGroupId
          AssignPublicIp: DISABLED
      LoadBalancers:
        - TargetGroupArn: !Ref OAuthGatewayTargetGroupArn
          ContainerName: oauth-gateway
          ContainerPort: 8000
      ServiceRegistries:
        - RegistryArn: !Ref OAuthGatewayServiceDiscoveryArn
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-oauthgateway-ecsservice
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

