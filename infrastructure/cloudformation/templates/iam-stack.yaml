    Value: !GetAtt OAuthGatewayTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OAuthGatewayTaskRoleArn

  CombinedServiceTaskRoleArn:
    Description: ARN of the Combined Service Task Role
    Value: !GetAtt CombinedServiceTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CombinedServiceTaskRoleArn

  OutlookServiceTaskRoleArn:
    Description: ARN of the Outlook Service Task Role
    Value: !GetAtt OutlookServiceTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OutlookServiceTaskRoleArn

  SharePointServiceTaskRoleArn:
