AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Application: MCP (Model Context Protocol)
  Purpose: IAM Roles and Policies for MCP Services
  Owner: AIO Platform Team
  Managed by: AIO Platform Team

Parameters:
  AWSAccountName:
    Type: String
    Default: "alic-aio-mcp"
    Description: "AWS Account Name for resource naming (format: company-group-app)"

  CompanyName:
    Type: String
    Default: "alic"
    Description: Company identifier
    AllowedValues:
      - alic

  AppName:
    Type: String
    Default: "mcp"
    Description: Application or project name (lowercase, no spaces)
    AllowedPattern: "^[a-z0-9-]+$"

  Environment:
    Type: String
    Default: p
    AllowedValues:
      - d    # Development
      - t    # Test
      - m    # Model (UAT/Staging)
      - p    # Production
    Description: Deployment environment

  DataClassification:
    Type: String
    Default: confidential
    AllowedValues:
      - public
      - confidential
      - secret
    Description: Data classification level

  OwnerEmail:
    Type: String
    Default: "aio-support@ameritas.com"
    Description: Owner email for tagging

  CostCenter:
    Type: String
    Default: "aio"
    Description: Cost center for billing

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Naming Configuration"
        Parameters:
          - AWSAccountName
          - CompanyName
          - AppName
          - Environment
      - Label:
          default: "Compliance & Tagging"
        Parameters:
          - DataClassification
          - OwnerEmail
          - CostCenter

Resources:
  # ECS Task Execution Role (shared across all services)
  # Pattern: {app}-{env}-{purpose}-iamrole
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-ecs-task-execution-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-secretsmanager-readonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AppName}/${Environment}/*
        - PolicyName: !Sub ${AppName}-${Environment}-ssm-readonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppName}/${Environment}/*
        - PolicyName: !Sub ${AppName}-${Environment}-kms-decrypt-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService:
                      - !Sub secretsmanager.${AWS::Region}.amazonaws.com
                      - !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-ecs-task-execution-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # OAuth Gateway Task Role
  OAuthGatewayTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-oauthgateway-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-cloudwatch-writeonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppName}-${Environment}-oauthgateway:*
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-oauthgateway-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Combined Service Task Role
  CombinedServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-combined-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-cloudwatch-writeonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppName}-${Environment}-combined:*
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-combined-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Outlook Service Task Role
  OutlookServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-outlook-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-cloudwatch-writeonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppName}-${Environment}-outlook:*
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-outlook-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # SharePoint Service Task Role
  SharePointServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-sharepoint-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-cloudwatch-writeonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppName}-${Environment}-sharepoint:*
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-sharepoint-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Teams Service Task Role
  TeamsServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-teams-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
