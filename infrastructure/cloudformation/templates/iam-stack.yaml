      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-teams-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Azure DevOps Service Task Role
  AzureDevOpsServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-azuredevops-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub ${AppName}-${Environment}-cloudwatch-writeonly-iampolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppName}-${Environment}-azuredevops:*
      Tags:
        - Key: Name
          Value: !Sub ${AppName}-${Environment}-azuredevops-task-iamrole
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref AppName
        - Key: Owner
          Value: !Ref OwnerEmail
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedBy
          Value: CloudFormation

  # Snowflake Service Task Role
  SnowflakeServiceTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-${Environment}-snowflake-task-iamrole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
