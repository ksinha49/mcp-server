[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-oauth-lib"
version = "1.0.0"
description = "Shared OAuth library for MCP servers - MCP 2025-06-18 compliant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Enterprise MCP Team" }
]
keywords = ["mcp", "oauth", "pkce", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_oauth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
